name: LeetCode Daily Sync

on:
  push:
    branches:
      - main
  schedule:
    # 3:00 AM IST corresponds to 21:30 UTC the previous day
    - cron: '30 21 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_NODE20: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run LeetCode Sync Script
        env:
          LEETCODE_USERNAME_: ${{ secrets.LEETCODE_USERNAME_ }}
          LEETCODE_SESSION_COOKIE_: ${{ secrets.LEETCODE_SESSION_COOKIE_ }}
          GITHUB_REPO_URL_: ${{ secrets.GITHUB_REPO_URL_ }}
          LOCAL_REPO_DIR_: "."
        run: |
          python sync.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync LeetCode submissions [$(date -u +'%Y-%m-%d')]" && git push)